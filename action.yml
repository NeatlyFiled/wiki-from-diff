name: Neatlyfiled wiki from diff
description: Records each push in your Neatlyfiled wiki (commits, files, diff) and hands the job a short-lived wiki token for your own agent. No secrets, no model.
author: Neatlyfiled
branding:
  icon: book-open
  color: blue

inputs:
  wiki:
    description: Your wiki's subdomain (acme for https://acme.neatlyfiled.com) or its full https address
    required: true
  record:
    description: '"true" records the push as a wiki page; "false" only gets the token'
    required: false
    default: 'true'
  folder:
    description: Wiki folder for this repository's push pages (default "changes/<repository name>")
    required: false
    default: ''
  ignore:
    description: Globs (one per line or comma-separated) of files to leave out of the diff, on top of lockfiles, build output, minified, vendored, generated and binary files
    required: false
    default: ''
  max-diff-bytes:
    description: Most bytes of diff sent; larger diffs are cut per file, with a note
    required: false
    default: '120000'

outputs:
  token:
    description: A write token for the wiki, valid for an hour (masked in logs); send it as "Authorization Bearer <token>"
  mcp-url:
    description: The wiki's MCP server (streamable HTTP)
  api-url:
    description: The wiki's JSON API
  wiki-url:
    description: The wiki's address
  page:
    description: The push's page in the wiki, e.g. changes/api/2026/11/2026-11-04-abc1234.md (when recorded)
  revision:
    description: The wiki revision that recorded the push (when recorded)
  skipped:
    description: Why the push was not recorded, if a commit message contains [skip wiki]

runs:
  using: node24
  main: src/main.ts
